name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Routing rules self-test
        run: |
          mkdir -p /tmp/t
          javac -d /tmp/t app/src/main/java/com/kg4bhr/callrouter/RouteEngine.java \
                          app/src/main/java/com/kg4bhr/callrouter/Defaults.java \
                          tools/RouteEngineTest.java
          java -cp /tmp/t com.kg4bhr.callrouter.RouteEngineTest

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CallRouter-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CallRouter-${{ github.run_number }}
          path: CallRouter-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Call Router build ${{ github.run_number }}
          files: CallRouter-${{ github.run_number }}.apk
          make_latest: true
